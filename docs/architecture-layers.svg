<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="580" height="422" viewBox="0 0 580 422">
  <title>corvus internal layering</title>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Layer 1: Public API -->
    <rect x="12" y="12" width="556" height="52" rx="14"
          fill="#1b4d8f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="290" y="34" font-size="15" font-weight="bold" fill="#ffffff">Public API</text>
    <text x="290" y="52" font-size="11" fill="#ffffff">include/corvus/corvus.h — std::span in/out &#183; std-only &#183; Highway never appears here</text>

    <!-- Layer 2: Runtime dispatch -->
    <rect x="12" y="72" width="556" height="52" rx="14"
          fill="#2e6fca" stroke="#1a1a1a" stroke-width="3"/>
    <text x="290" y="94" font-size="15" font-weight="bold" fill="#ffffff">Runtime dispatch — src/&lt;fn&gt;.cpp, one TU per family</text>
    <text x="290" y="112" font-size="11" fill="#ffffff">foreach_target.h &#183; HWY_EXPORT &#183; HWY_DYNAMIC_DISPATCH</text>

    <!-- Layer 3: Per-target kernels (contains function kernels + dd primitives) -->
    <rect x="12" y="132" width="556" height="158" rx="14"
          fill="#5b2d8f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="290" y="153" font-size="15" font-weight="bold" fill="#ffffff">Per-target kernels — written against ops:: only</text>

    <!-- Function kernels block -->
    <rect x="24" y="162" width="340" height="116" rx="10"
          fill="#a884e8" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="194" y="181" font-size="12.5" font-weight="bold" fill="#000000">Function kernels</text>
    <rect x="36" y="190" width="316" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="194" y="205" font-size="10" font-weight="bold" fill="#000000">&lt;fn&gt;-inl.h / &lt;fn&gt;_core-inl.h — cores + per-lane drivers</text>
    <rect x="36" y="218" width="316" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="194" y="233" font-size="10" font-weight="bold" fill="#000000">one masked code path — vector body + tail</text>
    <rect x="36" y="246" width="316" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="194" y="261" font-size="10" font-weight="bold" fill="#000000">&lt;fn&gt;_data.h / .inc — checked-in coefficient tables</text>

    <!-- dd primitives block -->
    <rect x="376" y="162" width="180" height="116" rx="10"
          fill="#cbaef5" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="466" y="181" font-size="12.5" font-weight="bold" fill="#000000">dd primitives</text>
    <rect x="388" y="190" width="156" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="466" y="205" font-size="10" font-weight="bold" fill="#000000">dd-inl.h — exact arithmetic</text>
    <rect x="388" y="218" width="156" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="466" y="233" font-size="10" font-weight="bold" fill="#000000">dd_special-inl.h</text>
    <rect x="388" y="246" width="156" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="466" y="261" font-size="10" font-weight="bold" fill="#000000">exp_dd / log_dd-inl.h</text>

    <!-- Layer 4: ops:: facade -->
    <rect x="12" y="298" width="556" height="52" rx="14"
          fill="#d08c00" stroke="#1a1a1a" stroke-width="3"/>
    <text x="290" y="320" font-size="15" font-weight="bold" fill="#ffffff">ops:: facade — src/ops-inl.h</text>
    <text x="290" y="338" font-size="11" fill="#ffffff">~20-op surface mirroring hn:: names 1:1 — the only file that touches hn::</text>

    <!-- Layer 5: SIMD backend (Highway) -->
    <rect x="12" y="358" width="556" height="52" rx="14"
          fill="#00784f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="290" y="380" font-size="15" font-weight="bold" fill="#ffffff">Google Highway — multi-target codegen, runtime dispatch</text>
    <text x="290" y="398" font-size="11" fill="#ffffff">swappable — std::simd or another primitives library, by reimplementing ops-inl.h only</text>

  </g>
</svg>
